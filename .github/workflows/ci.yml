name: test-and-build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build setup executable
        shell: pwsh
        run: ./tools/build-friend-test-setup.ps1 -OutDir artifacts
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Isaac-Freund-Test-Setup-v0.0.2
          path: artifacts/Isaac-Freund-Test-Setup.exe
